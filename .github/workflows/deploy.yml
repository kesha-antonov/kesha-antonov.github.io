name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # daily refresh of npm and GitHub numbers
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed stats.json
    steps:
      # Third-party code (npm install scripts, the build) must not see a write token,
      # so checkout does not store it; only the commit step gets it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh stats (keeps last good values on failure)
        run: npm run stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit refreshed stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add src/data/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Update stats"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
